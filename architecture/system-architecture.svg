<title id="title">YunChuang AI SaaS Platform — System Architecture</title>
<desc id="desc">Six responsibility layers with independent Mini Program and Admin entry points, shared CloudBase business data, separate SQLite administrator authentication, tenant governance, Dify knowledge and workflows, models, runtime services, and infrastructure. Lines show only confirmed integration or capability association.</desc>
