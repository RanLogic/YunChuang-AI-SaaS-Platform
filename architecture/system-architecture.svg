<text x="103" y="1413" class="body">Tencent Cloud · Docker · Nginx · Dify Server · Ollama</text>
<text x="103" y="1438" class="body">基础设施组成；不表示容器拓扑、网络连接或服务器资源关系</text>
<text x="40" y="1514" class="layer">橙色虚线边界：租户治理贯穿服务端、业务数据访问与租户级 AI 资源。</text>
<text x="40" y="1543" class="small">它是现有系统内的治理机制，不代表独立微服务；SQLite 与共享 CloudBase 是独立存储边界。</text>
<text x="40" y="1576" class="small">关系说明：实线仅表示确认的业务集成；灰色虚线表示知识检索与 AI 编排的能力关联。</text>
<text x="40" y="1605" class="small">职责分层不等同于部署拓扑；模型、运行服务之间未绘制未经确认的调用路径。</text>
